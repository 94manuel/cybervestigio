x-app-base: &app-base
  working_dir: /app
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: cybervestigio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cybervestigio
      POSTGRES_USER: cybervestigio
      POSTGRES_PASSWORD: cybervestigio_dev_password
    ports:
      - "5432:5432"
    volumes:
      - cybervestigio_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybervestigio -d cybervestigio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cybervestigio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cybervestigio_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    container_name: cybervestigio-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
    ports:
      - "5678:5678"
    volumes:
      - cybervestigio_n8n_data:/home/node/.n8n

  api:
    <<: *app-base
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: cybervestigio-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://cybervestigio:cybervestigio_dev_password@postgres:5432/cybervestigio?schema=public
      JWT_SECRET: cambiar-por-clave-segura-de-al-menos-32-caracteres
      JWT_EXPIRES_IN: 8h
      ADMIN_INITIAL_NAME: Administrador CyberVestigio
      ADMIN_INITIAL_EMAIL: admin@cybervestigio.co
      ADMIN_INITIAL_PASSWORD: Cambiar-Esta-Clave-123!
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MAIL_QUEUE_NAME: ${MAIL_QUEUE_NAME:-cybervestigio-mail}
    command: >
      sh -c "npm run prisma:generate
      && npm run prisma:deploy
      && npm run prisma:seed
      && npm run start:dev"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailer:
    <<: *app-base
    build:
      context: ./apps/mailer
      dockerfile: Dockerfile
    container_name: cybervestigio-mailer
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MAIL_QUEUE_NAME: ${MAIL_QUEUE_NAME:-cybervestigio-mail}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-contacto@cybervestigio.com}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-contacto@cybervestigio.com}
    command: >
      sh -c "npm run dev"

  web:
    <<: *app-base
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: cybervestigio-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      API_INTERNAL_URL: http://api:4000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      N8N_CHAT_WEBHOOK_URL: ${N8N_CHAT_WEBHOOK_URL:-}
      N8N_CHAT_WEBHOOK_TOKEN: ${N8N_CHAT_WEBHOOK_TOKEN:-}
    command: >
      sh -c "npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null || exit 1"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  cybervestigio_pg_data:
  cybervestigio_redis_data:
  cybervestigio_n8n_data:
