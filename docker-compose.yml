x-app-base: &app-base
  working_dir: /app
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: cybervestigio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cybervestigio
      POSTGRES_USER: cybervestigio
      POSTGRES_PASSWORD: cybervestigio_dev_password
    ports:
      - "5432:5432"
    volumes:
      - cybervestigio_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybervestigio -d cybervestigio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cybervestigio-redis
    restart: unless-stopped
    volumes:
      - cybervestigio_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2026-01-03T02-03-07Z
    container_name: cybervestigio-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cybervestigio_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-12-17T23-32-03Z
    container_name: cybervestigio-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}
        && mc mb --ignore-existing local/${MINIO_BUCKET:-cybervestigio-drive}
        && mc anonymous set none local/${MINIO_BUCKET:-cybervestigio-drive}

  n8n:
    image: n8nio/n8n:latest
    container_name: cybervestigio-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
    ports:
      - "5678:5678"
    volumes:
      - cybervestigio_n8n_data:/home/node/.n8n

  api:
    <<: *app-base
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: cybervestigio-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://cybervestigio:cybervestigio_dev_password@postgres:5432/cybervestigio?schema=public
      JWT_SECRET: cambiar-por-clave-segura-de-al-menos-32-caracteres
      JWT_EXPIRES_IN: 8h
      ADMIN_INITIAL_NAME: Administrador CyberVestigio
      ADMIN_INITIAL_EMAIL: admin@cybervestigio.co
      ADMIN_INITIAL_PASSWORD: Cambiar-Esta-Clave-123!
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MAIL_QUEUE_NAME: ${MAIL_QUEUE_NAME:-cybervestigio-mail}
      WAF_ENABLED: ${WAF_ENABLED:-true}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-cybervestigio-drive}
      PORTAL_DEFAULT_SERVICE_PRICE: ${PORTAL_DEFAULT_SERVICE_PRICE:-250000}
      PAYMENT_NEQUI_ACCOUNT: ${PAYMENT_NEQUI_ACCOUNT:-3000000000}
      PAYMENT_DAVIPLATA_ACCOUNT: ${PAYMENT_DAVIPLATA_ACCOUNT:-3000000001}
      PAYMENT_TRANSFER_ACCOUNT: ${PAYMENT_TRANSFER_ACCOUNT:-Cuenta empresarial CyberVestigio}
      PAYMENT_PSE_URL: ${PAYMENT_PSE_URL:-https://www.pse.com.co/}
    command: >
      sh -c "npm run prisma:generate
      && npm run prisma:deploy
      && npm run prisma:seed
      && npm run start:dev"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailer:
    <<: *app-base
    build:
      context: ./apps/mailer
      dockerfile: Dockerfile
    container_name: cybervestigio-mailer
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MAIL_QUEUE_NAME: ${MAIL_QUEUE_NAME:-cybervestigio-mail}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-contacto@cybervestigio.com}
    command: >
      sh -c "npm run dev"

  web:
    <<: *app-base
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: cybervestigio-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      API_INTERNAL_URL: http://api:4000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      N8N_CHAT_WEBHOOK_URL: ${N8N_CHAT_WEBHOOK_URL:-}
      N8N_CHAT_WEBHOOK_TOKEN: ${N8N_CHAT_WEBHOOK_TOKEN:-}
    command: >
      sh -c "npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null || exit 1"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  cybervestigio_pg_data:
  cybervestigio_redis_data:
  cybervestigio_n8n_data:
  cybervestigio_minio_data:
