apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cybervestigio-ingress
  namespace: cybervestigio
spec:
  ingressClassName: nginx
  rules:
    - host: cybervestigio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 3000

    - host: www.cybervestigio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 3000

    - host: api.cybervestigio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 4000

    - host: n8n.cybervestigio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n-service
                port:
                  number: 5678

    - host: minio.cybervestigio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio-service
                port:
                  number: 9000

    - host: minio-console.cybervestigio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio-service
                port:
                  number: 9001