x-app-base: &app-base
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: cybervestigio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cybervestigio_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cybervestigio-redis
    restart: unless-stopped
    volumes:
      - cybervestigio_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    container_name: cybervestigio-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - cybervestigio_n8n_data:/home/node/.n8n

  api:
    <<: *app-base
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    container_name: cybervestigio-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      ADMIN_INITIAL_NAME: ${ADMIN_INITIAL_NAME}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MAIL_QUEUE_NAME: ${MAIL_QUEUE_NAME:-cybervestigio-mail}
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  mailer:
    <<: *app-base
    build:
      context: ./apps/mailer
      dockerfile: Dockerfile.prod
    container_name: cybervestigio-mailer
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MAIL_QUEUE_NAME: ${MAIL_QUEUE_NAME:-cybervestigio-mail}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}

  web:
    <<: *app-base
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
    container_name: cybervestigio-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:4000/api/v1
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      N8N_CHAT_WEBHOOK_URL: ${N8N_CHAT_WEBHOOK_URL}
      N8N_CHAT_WEBHOOK_TOKEN: ${N8N_CHAT_WEBHOOK_TOKEN}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  cybervestigio_pg_data:
  cybervestigio_redis_data:
  cybervestigio_n8n_data: